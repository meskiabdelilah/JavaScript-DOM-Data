<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>E-commerce Analytics</title>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>E-commerce Analytics Dashboard</h1>
        </header>
        <section class="filter-panel">
            <div class="filter-group">
                <input type="text" id="search-input" placeholder="Rechercher un produit par nom">
            </div>
            <div class="filter-group">
                <select id="select-category"></select>
            </div>
            <div class="filter-group">
                <input type="checkbox" id="stock-checkbox" name="inStock" />
                <label for="stock-checkbox">En stock uniquement</label>
            </div>
            <div class="filter-group">
                <label for="sort-price">Trier par prix</label>
                <select id="sort-price">
                    <option value="none">Par défaut</option>
                    <option value="asc">Prix : croissant</option>
                    <option value="desc">Prix : décroissant</option>
                </select>
            </div>
            <div class="filter-actions">
                <button class="reset-btn" id="reset-btn" type="button">Réinitialiser les filtres</button>
            </div>
        </section>
            <div class="info-bar">
                <p id="result-counter" class="result-count">0 produit(s) trouvé(s)</p>
            </div>
            <main class="main-container">
                <div class="table-container"></div>
                <div class="cards-container">
                    <!-- Total Commandes -->
                    <div class="kpi-card">
                        <h3>Total Commandes</h3>
                        <p id="total-orders" class="kpi-value"></p>
                    </div>
                    <!-- Chiffre d'Affaires Total -->
                    <div class="kpi-card">
                        <h3>Chiffre d'Affaires</h3>
                        <p id="total-ca" class="kpi-value"></p>
                    </div>

                    <!-- Panier Moyen -->
                    <div class="kpi-card">
                        <h3>Panier Moyen</h3>
                        <p id="average-basket" class="kpi-value"></p>
                    </div>

                    <!--  Commandes Livrées -->
                    <div class="kpi-card">
                        <h3>Commandes Livrées</h3>
                        <p id="delivered-orders" class="kpi-value">0</p>
                    </div>

                    <!--  Commandes en Attente -->
                    <div class="kpi-card">
                        <h3>Commandes en Attente</h3>
                        <p id="pending-orders" class="kpi-value">0</p>
                    </div>

                    <!--  Taux de Livraison -->
                    <div class="kpi-card">
                        <h3>Taux de Livraison</h3>
                        <p id="delivery-rate" class="kpi-value">0%</p>
                    </div>
                </div>
            </main>
    </div>


    <script src="js/api.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>


</body>
</html>
